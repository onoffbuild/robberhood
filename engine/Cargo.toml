[package]
name = "loxley-engine"
version = "0.1.0"
edition = "2024"
description = "the hot path for loxley: sequencer feed in, pre-signed transactions out"
license = "MIT"

[[bin]]
name = "loxley-engine"
path = "src/main.rs"

[dependencies]
alloy = { version = "1", features = ["full"] }
alloy-consensus = { version = "1", features = ["k256"] }
arb-sequencer-consensus = "0.5"
sequencer_client = "0.5"
tokio = { version = "1", features = ["full"] }
futures-util = "0.3"
rustls = "0.23"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
clap = { version = "4", features = ["derive", "env"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
anyhow = "1"
hex = "0.4"

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"
